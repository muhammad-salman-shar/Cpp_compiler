name: Build Android Target

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17 LTS
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inspect & Auto Build
        run: |
          echo "=== FILES IN REPOSITORY ==="
          ls -la
          
          # Case 1: Agar kisi subfolder me gradlew maujood ho
          GRADLEW_PATH=$(find . -name gradlew -type f | head -n 1)
          
          if [ -n "$GRADLEW_PATH" ]; then
            echo "Gradlew mila: $GRADLEW_PATH"
            BUILD_DIR=$(dirname "$GRADLEW_PATH")
            cd "$BUILD_DIR"
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
            mkdir -p $GITHUB_WORKSPACE/output
            find . -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \;
          else
            echo "Koi Gradle project nahi mila. Native Android C++ compilation execute ho rahi hai..."
            
            # Setup Android NDK Clang for ARM64 (Android phones)
            NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            CXX="$NDK_BIN/aarch64-linux-android33-clang++"
            
            mkdir -p $GITHUB_WORKSPACE/output
            
            if [ -f "CMakeLists.txt" ]; then
              cmake -B build -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a
              cmake --build build
              find build -type f -executable -exec cp {} $GITHUB_WORKSPACE/output/ \;
            else
              # Direct C++ compilation with NDK
              CPP_FILES=$(find . -maxdepth 2 -name "*.cpp")
              if [ -n "$CPP_FILES" ]; then
                $CXX -O3 $CPP_FILES -o $GITHUB_WORKSPACE/output/cpp_compiler_arm64
                echo "Android ARM64 binary build complete: cpp_compiler_arm64"
              else
                echo "::error::Repo me na Gradle mila aur na hi koi .cpp files!"
                exit 1
              fi
            fi
          fi

      - name: Upload Output
        uses: actions/upload-artifact@v4
        with:
          name: Cpp_compiler-Build-Output
          path: output/*
          if-no-files-found: error
