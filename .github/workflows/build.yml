name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          if [ -d "$ANDROID_HOME/ndk" ] && [ "$(ls -A $ANDROID_HOME/ndk)" ]; then
            LATEST_NDK=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
            echo "ANDROID_NDK_HOME=$LATEST_NDK" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$LATEST_NDK" >> $GITHUB_ENV
          fi

      - name: Build APK with Gradle
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cpp_compiler-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
