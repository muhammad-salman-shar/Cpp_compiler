name: Build Offline Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Android
        run: npm install @capacitor/android@^7.4.3

      - name: Typecheck
        run: npm run typecheck

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Generate Android app icons
        run: |
          mkdir -p resources
          if [ -f resources/icon.jpg ] && [ ! -f resources/icon.png ]; then
            sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
            convert resources/icon.jpg -resize 1024x1024^ -gravity center -extent 1024x1024 resources/icon.png
          fi
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#0b1220'

      - name: Sync Android project
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Cpp-Compiler-Offline-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cpp-Compiler-Offline-APK
          path: output/Cpp-Compiler-Offline-debug.apk
          if-no-files-found: error
