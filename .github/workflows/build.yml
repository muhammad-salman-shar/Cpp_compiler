name: Build Offline Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor Android tooling
        run: npm install @capacitor/android@^7.4.3

      - name: Build offline compiler UI
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Copy web app into Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Cpp-Compiler-Offline-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cpp-Compiler-Offline-APK
          path: output/Cpp-Compiler-Offline-debug.apk
          if-no-files-found: error
